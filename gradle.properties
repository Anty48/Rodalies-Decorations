# Memoria para Gradle (la deobf/decompilacion de NeoForge necesita bastante).
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true

## Environment Properties

# Version de Minecraft objetivo del port.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)

# NeoForge para 1.21.1 (rama 21.1.x).
neo_version=21.1.250
neo_version_range=[21.1,)
# El loader (FML) de NeoForge para 1.21.1 es la serie 4.x.
loader_version_range=[4,)

